<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RopaControl</title>
  <link rel="icon" href="assets/Logo.png" type="image/png">
  <link rel="stylesheet" href="./assets/css/style.css">

  <!-- Font Awesome para íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <button id="logoutBtn" style="position: absolute; top: 20px; right: 20px;">Cerrar Sesión</button>

  <div class="container">
    <header class="encabezado">
      <div class="bloque-central">
        <img src="assets/Logoo.png" alt="Logo" class="logo-grande">
        <h1 class="titulo-principal">Gestión de inventario de ropa</h1>
      </div>
    </header>

    <!-- Formulario solo para admin -->
    <form id="formulario-ropa" class="solo-admin">
      <h2 id="titulo-formulario" class="fondo-azul">Agregar producto</h2>
      <input type="hidden" id="id">
    
      <select id="tipo" required>
        <option value="" disabled selected>Tipo de prenda</option>
        <option value="sueter">Suéter</option>
        <option value="pantalon">Pantalón</option>
        <option value="camisa">Camisa</option>
        <option value="otra">Otra</option>
      </select>

      <select id="talla" required>
        <option value="" disabled selected>Talla</option>
      </select>
        
      <div style="position: relative;">
        <span style="position: absolute; top: 8px; left: 10px;">$</span>
        <input type="number" id="precio" placeholder="Precio" style="padding-left: 20px;" required>
      </div>

      <input type="number" id="cantidad" placeholder="Cantidad" min="1" required>

      <textarea id="descripcion" class="form-control" placeholder="Descripción del producto" rows="3" required></textarea>

      <button type="submit" class="btn-guardar">
        <i class="fas fa-plus-circle"></i> Agregar producto
      </button>
    </form>
    
    <div id="mensaje" class="mensaje"></div>

    <h2 class="fondo-azul">Tabla de productos</h2>

    <input type="text" id="busqueda" placeholder="Buscar por tipo o talla" style="margin-bottom: 10px; padding: 5px; width: 100%;">

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Talla</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Descripción</th>
            <th class="acciones-col">Acciones</th>
          </tr>
        </thead>
        <tbody id="lista-ropa"></tbody>
      </table>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="./js/storage.js"></script>
  <script type="module" src="./singleton_ealvarez/singleton.js"></script>
  <script type="module" src="./js/app.js"></script>

</body>
</html>
